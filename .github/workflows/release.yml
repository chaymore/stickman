name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      CERTIFICATE_P12: ${{ secrets.STICKMAN_CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.STICKMAN_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.STICKMAN_CI_KEYCHAIN_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.STICKMAN_NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.STICKMAN_NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.STICKMAN_NOTARY_TEAM_ID }}
      SIGN_IDENTITY: ${{ secrets.STICKMAN_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        if: ${{ env.CERTIFICATE_P12 != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/stickman-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/stickman-signing.keychain-db"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Store notarization credentials
        if: ${{ env.NOTARY_APPLE_ID != '' }}
        run: xcrun notarytool store-credentials StickmanCI --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
      - name: Build and package
        run: |
          export STICKMAN_SIGN_IDENTITY="${SIGN_IDENTITY:--}"
          if [[ -n "$NOTARY_APPLE_ID" ]]; then export STICKMAN_NOTARY_PROFILE="StickmanCI"; fi
          ./scripts/package-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ -z "$SIGN_IDENTITY" ]]; then RELEASE_FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/Stickman-*-macos-universal.zip dist/Stickman-*-macos-universal.zip.sha256 --generate-notes --title "Stickman $GITHUB_REF_NAME" "${RELEASE_FLAGS[@]}"
