name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Test
        run: swift test
      - name: Build universal app
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict dist/Stickman.app
          test "$(lipo -archs dist/Stickman.app/Contents/MacOS/StickmanBinary)" = "x86_64 arm64" || test "$(lipo -archs dist/Stickman.app/Contents/MacOS/StickmanBinary)" = "arm64 x86_64"
          plutil -lint dist/Stickman.app/Contents/Info.plist
      - name: Package test artifact
        run: STICKMAN_SKIP_BUILD=1 ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Stickman-macos-universal
          path: |
            dist/Stickman-*-macos-universal.zip
            dist/Stickman-*-macos-universal.zip.sha256
          if-no-files-found: error
